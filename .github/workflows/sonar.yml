name: SonarCloud
on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  sonarcloud:
    name: Build and analyze with SonarCloud
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile all Maven projects (best-effort)
        shell: bash
        run: |
          set -uo pipefail
          FAILED_PROJECTS=""

          while IFS= read -r pom; do
            dir=$(dirname "$pom")
            echo "::group::Compiling $dir"
            if mvn -B -q -f "$pom" \
                -DskipTests \
                --no-transfer-progress \
                clean compile 2>&1; then
              echo "  OK"
            else
              echo "  SKIPPED (build failed - plugin or dependency unresolvable)"
              FAILED_PROJECTS="$FAILED_PROJECTS\n  - $dir"
            fi
            echo "::endgroup::"
          done < <(find . -name pom.xml -not -path '*/target/*' | sort)

          if [ -n "$FAILED_PROJECTS" ]; then
            echo ""
            echo "The following projects were skipped and will be analyzed source-only:"
            printf '%b\n' "$FAILED_PROJECTS"
          fi

          # Always exit 0 — partial binaries are fine for Sonar source analysis
          exit 0

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=research-projects-all
            -Dsonar.projectKey=research-projects-all_SpringBoot-Projects-FullStack
            -Dsonar.sources=.
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.exclusions=**/target/**,**/.mvn/**,**/mvnw,**/mvnw.cmd
