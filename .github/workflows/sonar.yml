name: SonarCloud
on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  sonarcloud:
    name: Build and analyze with SonarCloud
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile all Maven projects (best-effort)
        shell: bash
        run: |
          set -uo pipefail
          FAILED_PROJECTS=""
          SKIPPED_PROJECTS=""

          # Plugins that are known-broken in public CI (no auth, repo gone, etc.)
          BLOCKED_PLUGINS=(
            "org.springframework.experimental:spring-aot-maven-plugin"
          )

          while IFS= read -r pom; do
            dir=$(dirname "$pom")

            # Check if this pom references any blocked plugin before attempting compile
            skip=false
            for plugin in "${BLOCKED_PLUGINS[@]}"; do
              if grep -q "$plugin" "$pom" 2>/dev/null; then
                skip=true
                blocked_by="$plugin"
                break
              fi
            done

            if [ "$skip" = true ]; then
              echo "::warning file=$pom::Skipping $dir — references blocked plugin: $blocked_by"
              SKIPPED_PROJECTS="$SKIPPED_PROJECTS\n  - $dir  (blocked plugin: $blocked_by)"
              continue
            fi

            echo "::group::Compiling $dir"
            if mvn -B -q -f "$pom" \
                -DskipTests \
                --no-transfer-progress \
                clean compile 2>&1; then
              echo "  OK"
            else
              echo "  FAILED"
              FAILED_PROJECTS="$FAILED_PROJECTS\n  - $dir"
            fi
            echo "::endgroup::"
          done < <(find . -name pom.xml -not -path '*/target/*' | sort)

          echo ""
          if [ -n "$SKIPPED_PROJECTS" ]; then
            echo "Projects skipped (blocked plugin — analyzed source-only by Sonar):"
            printf '%b\n' "$SKIPPED_PROJECTS"
          fi
          if [ -n "$FAILED_PROJECTS" ]; then
            echo "Projects that failed unexpectedly:"
            printf '%b\n' "$FAILED_PROJECTS"
          fi

          # Exit 0 — partial binaries are fine for Sonar source analysis
          exit 0

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=research-projects-all
            -Dsonar.projectKey=research-projects-all_SpringBoot-Projects-FullStack
            -Dsonar.sources=.
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.exclusions=**/target/**,**/.mvn/**,**/mvnw,**/mvnw.cmd
