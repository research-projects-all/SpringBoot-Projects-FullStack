name: SonarCloud

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Create SonarCloud properties
        shell: bash
        run: |
          cat > sonar-project.properties <<EOF
          sonar.projectKey=${{ secrets.research-projects-all_SpringBoot-Projects-FullStack }}
          sonar.organization=${{ secrets.research-projects-all }}
          sonar.host.url=https://sonarcloud.io

          sonar.sources=.
          sonar.sourceEncoding=UTF-8

          # This repo contains many independent Maven sample projects.
          # Some projects fail because of old dependencies, Java 6 settings,
          # or source files that do not compile on the GitHub runner.
          #
          # Do not run mvn compile here.
          # This keeps SonarCloud scanning source files without changing code.
          sonar.java.binaries=.

          sonar.exclusions=**/target/**,**/.git/**,**/.github/**
          EOF

          cat sonar-project.properties

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
