name: SonarCloud

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Build and analyze with SonarCloud
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 for Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Write pom patcher script
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/patch_pom.py <<'PY'
          import sys
          import re

          source = sys.argv[1]
          target = sys.argv[2]

          with open(source, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          content = re.sub(
              r"\s*<pluginRepository>.*?spring-releases.*?</pluginRepository>",
              "",
              content,
              flags=re.DOTALL,
          )

          content = re.sub(
              r"\s*<plugin>\s*<groupId>org\.springframework\.experimental</groupId>\s*<artifactId>spring-aot-maven-plugin</artifactId>.*?</plugin>",
              "",
              content,
              flags=re.DOTALL,
          )

          content = re.sub(
              r"\s*<dependency>\s*<groupId>org\.springframework\.experimental</groupId>\s*<artifactId>spring-native</artifactId>.*?</dependency>",
              "",
              content,
              flags=re.DOTALL,
          )

          with open(target, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Compile Maven projects
        shell: bash
        run: |
          set -uo pipefail

          FAILED=""

          while IFS= read -r pom; do
            dir="$(dirname "$pom")"
            echo "::group::Compiling Maven project: $dir"

            target_pom="$pom"
            extra_flags=()

            # Patch only the CI workspace.
            # This does not commit or change repository source code.
            if grep -q "spring-aot-maven-plugin\|spring-native\|spring-native.version" "$pom" 2>/dev/null; then
              target_pom="$dir/.ci-pom.xml"
              python3 /tmp/patch_pom.py "$pom" "$target_pom"
              echo "Patched Spring Native / AOT blocks for CI compile"
            fi

            boot_ver="$(python3 - "$pom" <<'PY'
          import re
          import sys

          with open(sys.argv[1], "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          match = re.search(
              r"<artifactId>\s*spring-boot-starter-parent\s*</artifactId>\s*<version>\s*([^<]+)\s*</version>",
              content,
              re.DOTALL,
          )

          print(match.group(1).strip() if match else "")
          PY
          )"

            case "$boot_ver" in
              2.2.*|2.3.*|2.4.*)
                extra_flags+=("-Dlombok.version=1.18.30")
                echo "Using Lombok 1.18.30 for Spring Boot $boot_ver"
                ;;
            esac

            case "$boot_ver" in
              1.*)
                extra_flags+=("-Dmaven.compiler.source=8" "-Dmaven.compiler.target=8")
                echo "Using Java source/target 8 for Spring Boot $boot_ver"
                ;;
            esac

            if [ -d "$dir/src" ] && grep -rq "com\.sun\.istack" "$dir/src" 2>/dev/null; then
              extra_flags+=("-Dmaven.compiler.compilerArgs=--add-exports=java.xml.bind/com.sun.istack.internal=ALL-UNNAMED")
              echo "Added compiler export for com.sun.istack.internal"
            fi

            build_output="$(
              mvn -B -q -f "$target_pom" \
                -DskipTests \
                -Dmaven.test.skip=true \
                -Dcheckstyle.skip=true \
                -Dpmd.skip=true \
                -Dspotbugs.skip=true \
                --no-transfer-progress \
                "${extra_flags[@]}" \
                clean compile 2>&1
            )"
            rc=$?

            if [ "$rc" -eq 0 ]; then
              echo "OK"
            else
              echo "$build_output"
              echo "FAILED, but the SonarCloud scan will continue"
              FAILED="$FAILED
          - $dir"
            fi

            echo "::endgroup::"
          done < <(find . -name pom.xml -not -path "*/target/*" -not -name ".ci-pom.xml" | sort)

          if [ -n "$FAILED" ]; then
            printf '\nMaven projects that did not compile:%b\n' "$FAILED"
          fi

          exit 0

      - name: Set up JDK 8 for old Gradle projects
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 5.6.4

      - name: Compile Gradle projects
        shell: bash
        run: |
          set -uo pipefail

          FAILED=""

          while IFS= read -r build; do
            dir="$(dirname "$build")"
            echo "::group::Compiling Gradle project: $dir"

            build_output="$(
              cd "$dir" && \
              gradle compileJava \
                --no-daemon \
                --quiet \
                -x test 2>&1
            )"
            rc=$?

            if [ "$rc" -eq 0 ]; then
              echo "OK"
            else
              echo "$build_output"
              echo "FAILED, but the SonarCloud scan will continue"
              FAILED="$FAILED
          - $dir"
            fi

            echo "::endgroup::"
          done < <(find . -name build.gradle -not -path "*/target/*" -not -path "*/build/*" | sort)

          if [ -n "$FAILED" ]; then
            printf '\nGradle projects that did not compile:%b\n' "$FAILED"
          fi

          exit 0

      - name: Set up JDK 17 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create SonarCloud properties
        shell: bash
        run: |
          set -euo pipefail

          binary_paths="$(
            find . \
              \( -path "*/target/classes" -o -path "*/build/classes/java/main" \) \
              -type d \
              | sort \
              | paste -sd, -
          )"

          if [ -z "$binary_paths" ]; then
            binary_paths="."
          fi

          test_paths="$(
            find . \
              \( -path "*/src/test" -o -path "*/src/test/java" \) \
              -type d \
              | sort \
              | paste -sd, -
          )"

          cat > sonar-project.properties <<EOF
          sonar.organization=research-projects-all
          sonar.projectKey=research-projects-all_SpringBoot-Projects-FullStack
          sonar.host.url=https://sonarcloud.io

          sonar.sources=.
          sonar.sourceEncoding=UTF-8

          sonar.java.binaries=$binary_paths

          sonar.exclusions=**/target/**,**/build/**,**/.git/**,**/.github/**,**/.mvn/**,**/mvnw,**/mvnw.cmd,**/node_modules/**,**/frontend/**,**/.ci-pom.xml,**/src/test/**
          sonar.coverage.exclusions=**/test/**,**/*Test*.java,**/*Tests*.java,**/*Application.java
          EOF

          if [ -n "$test_paths" ]; then
            {
              echo "sonar.tests=$test_paths"
              echo "sonar.test.inclusions=**/*.java"
            } >> sonar-project.properties
          fi

          echo "Generated sonar-project.properties"
          echo "Binary directories found:"
          echo "$binary_paths" | tr ',' '\n' | wc -l

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
