name: SonarCloud
on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Build and analyze with SonarCloud
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Write pom patcher script
        run: |
          python3 -c "
          script = '''
          import sys, re
          content = open(sys.argv[1]).read()
          content = re.sub(r\"\s*<pluginRepository>.*?spring-releases.*?</pluginRepository>\", \"\", content, flags=re.DOTALL)
          content = re.sub(r\"\s*<plugin>\s*<groupId>org\.springframework\.experimental</groupId>\s*<artifactId>spring-aot-maven-plugin</artifactId>.*?</plugin>\", \"\", content, flags=re.DOTALL)
          content = re.sub(r\"\s*<dependency>\s*<groupId>org\.springframework\.experimental</groupId>\s*<artifactId>spring-native</artifactId>.*?</dependency>\", \"\", content, flags=re.DOTALL)
          open(sys.argv[2], \"w\").write(content)
          '''
          open('/tmp/patch_pom.py', 'w').write(script.strip())
          "

      # ── Maven projects ─────────────────────────────────────────────────────
      - name: Compile Maven projects
        shell: bash
        run: |
          set -uo pipefail
          FAILED=""

          while IFS= read -r pom; do
            dir=$(dirname "$pom")
            echo "::group::Compiling $dir"

            target_pom="$pom"
            extra_flags=()

            # Fix 1: strip dead spring-native experimental stack
            if grep -q "spring-aot-maven-plugin\|spring-native.version" "$pom" 2>/dev/null; then
              patched_pom=$(mktemp /tmp/pom-XXXX.xml)
              python3 /tmp/patch_pom.py "$pom" "$patched_pom"
              target_pom="$patched_pom"
              echo "  (spring-native blocks patched out)"
            fi

            # Fix 2: Lombok < 1.18.20 breaks on JDK17 — override to 1.18.30
            boot_ver=$(python3 -c "
          import re
          c = open('$pom').read()
          m = re.search(r'spring-boot-starter-parent.*?<version>([^<]+)</version>', c, re.DOTALL)
          print(m.group(1) if m else '')
          " 2>/dev/null)
            case "$boot_ver" in
              2.2.*|2.3.*|2.4.*)
                extra_flags+=("-Dlombok.version=1.18.30")
                echo "  (lombok pinned to 1.18.30 for Boot $boot_ver)"
                ;;
            esac

            # Fix 3: Boot 1.x defaults to Java 6 source/target — dropped in JDK17
            case "$boot_ver" in
              1.*)
                extra_flags+=("-Dmaven.compiler.source=8" "-Dmaven.compiler.target=8")
                echo "  (compiler source/target set to 8 for Boot $boot_ver)"
                ;;
            esac

            # Fix 4: com.sun.istack.internal removed in JDK9+
            if grep -rq "com\.sun\.istack" "$(dirname "$pom")/src" 2>/dev/null; then
              extra_flags+=("-Dmaven.compiler.compilerArg=--add-exports=java.xml.bind/com.sun.istack.internal=ALL-UNNAMED")
              echo "  (--add-exports for com.sun.istack.internal)"
            fi

            build_output=$(mvn -B -q -f "$target_pom" \
              -DskipTests \
              --no-transfer-progress \
              "${extra_flags[@]}" \
              clean compile 2>&1) && rc=0 || rc=$?

            if [ $rc -eq 0 ]; then
              echo "  OK"
            else
              echo "$build_output"
              echo "  FAILED"
              FAILED="$FAILED\n  - $dir"
            fi
            echo "::endgroup::"
          done < <(find . -name pom.xml -not -path '*/target/*' | sort)

          [ -n "$FAILED" ] && printf '\nUnexpected compile failures:\n%b\n' "$FAILED"
          exit 0

      # ── Gradle projects ────────────────────────────────────────────────────
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Compile Gradle projects
        shell: bash
        run: |
          set -uo pipefail
          FAILED=""

          while IFS= read -r build; do
            dir=$(dirname "$build")
            echo "::group::Compiling (Gradle) $dir"

            build_output=$(cd "$dir" && \
              gradle compileJava \
                --no-daemon \
                --quiet \
                --warning-mode none \
                -x test 2>&1) && rc=0 || rc=$?

            if [ $rc -eq 0 ]; then
              echo "  OK"
            else
              echo "$build_output"
              echo "  SKIPPED (source-only Sonar analysis)"
              FAILED="$FAILED\n  - $dir"
            fi
            echo "::endgroup::"
          done < <(find . -name build.gradle -not -path '*/target/*' | sort)

          [ -n "$FAILED" ] && printf '\nGradle skipped (source-only):\n%b\n' "$FAILED"
          exit 0

      # ── Write sonar-project.properties ─────────────────────────────────────
      # sonar.java.binaries MUST be in sonar-project.properties, NOT passed as
      # a CLI -D argument. The scanner splits CLI args on whitespace, so paths
      # containing spaces (e.g. "Part-1 Spring Boot Basic Fund Projects/...")
      # become "Unrecognized option: Spring". Properties files are parsed
      # differently and handle spaces in values correctly.
      - name: Write sonar-project.properties
        run: |
          python3 -c "
          import subprocess, os

          # Collect every classes dir that actually exists after compilation
          result = subprocess.run(
            ['find', '.', '-type', 'd',
             '(', '-path', '*/target/classes', '-o', '-path', '*/build/classes/java/main', ')'],
            capture_output=True, text=True
          )
          # Use find with proper args
          import glob
          dirs = []
          for pattern in ['**/target/classes', '**/build/classes/java/main']:
            for d in glob.glob(pattern, recursive=True):
              if os.path.isdir(d):
                dirs.append(d)
          dirs.sort()
          binaries = ','.join(dirs) if dirs else '.'

          lines = [
            'sonar.organization=research-projects-all',
            'sonar.projectKey=research-projects-all_SpringBoot-Projects-FullStack',
            'sonar.sources=.',
            'sonar.java.binaries=' + binaries,
            'sonar.tests=.',
            'sonar.test.inclusions=**/src/test/**/*.java',
            'sonar.exclusions=**/target/**,**/build/**,**/.mvn/**,**/mvnw,**/mvnw.cmd,**/node_modules/**,**/frontend/**',
            'sonar.coverage.exclusions=**/test/**,**/*Test*.java,**/*Tests*.java,**/*Application.java',
          ]
          open('sonar-project.properties', 'w').write('\n'.join(lines) + '\n')
          print('Written sonar-project.properties')
          print('Binary dirs:', len(dirs))
          "

      # ── SonarCloud ─────────────────────────────────────────────────────────
      # No args= block — all config is read from sonar-project.properties.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
