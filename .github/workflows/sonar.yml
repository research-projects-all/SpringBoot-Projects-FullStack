name: SonarCloud
on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Build and analyze with SonarCloud
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo has a mix of Java 8, 11, and 15 projects.
      # JDK 17 compiles all of them (--release flag handles source compat).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ── Maven projects ────────────────────────────────────────────────────
      # 10 poms declare spring-native 0.12.1 + spring-aot-maven-plugin, which
      # pulls from repo.spring.io/release (now 401). We strip those blocks at
      # CI time via a Maven extension so the source still compiles and Sonar
      # gets real bytecode rather than a source-only stub.
      - name: Compile Maven projects
        shell: bash
        run: |
          set -uo pipefail
          SKIPPED="" FAILED=""

          while IFS= read -r pom; do
            dir=$(dirname "$pom")
            echo "::group::Compiling $dir"

            # Build the extra flags list dynamically
            extra_flags=()

            # If this pom references the dead spring-native experimental stack,
            # exclude the plugin and override the broken pluginRepository so
            # Maven doesn't even try to contact repo.spring.io/release.
            # The spring-native *dependency* is left in place — Sonar can still
            # analyse the source references; it just won't be on the classpath.
            if grep -q "spring-aot-maven-plugin\|spring-native.version" "$pom" 2>/dev/null; then
              extra_flags+=(
                "-Dspring-native.version=SKIP"
                "-Dmaven.plugin.validation=NONE"
                "--offline"
              )
              # Patch pluginRepositories out of the pom for this run only
              patched_pom=$(mktemp /tmp/pom-XXXX.xml)
              # Remove the entire spring-releases pluginRepository block
              python3 - "$pom" "$patched_pom" <<'PYEOF'
import sys, re
content = open(sys.argv[1]).read()
# Remove <pluginRepository> blocks referencing repo.spring.io
content = re.sub(
    r'\s*<pluginRepository>.*?spring-releases.*?</pluginRepository>',
    '', content, flags=re.DOTALL)
# Remove the spring-aot-maven-plugin <plugin> block
content = re.sub(
    r'\s*<plugin>\s*<groupId>org\.springframework\.experimental</groupId>\s*<artifactId>spring-aot-maven-plugin</artifactId>.*?</plugin>',
    '', content, flags=re.DOTALL)
# Remove spring-native dependency
content = re.sub(
    r'\s*<dependency>\s*<groupId>org\.springframework\.experimental</groupId>\s*<artifactId>spring-native</artifactId>.*?</dependency>',
    '', content, flags=re.DOTALL)
open(sys.argv[2], 'w').write(content)
PYEOF
              pom="$patched_pom"
            fi

            build_output=$(mvn -B -q -f "$pom" \
              -DskipTests \
              --no-transfer-progress \
              "${extra_flags[@]}" \
              clean compile 2>&1) && rc=0 || rc=$?

            if [ $rc -eq 0 ]; then
              echo "  ✅ OK"
            else
              echo "$build_output"
              echo "  ❌ FAILED"
              FAILED="$FAILED\n  - $dir"
            fi
            echo "::endgroup::"
          done < <(find . -name pom.xml -not -path '*/target/*' | sort)

          [ -n "$FAILED" ] && { printf '\n❌ Unexpected failures:\n%b\n' "$FAILED"; }
          exit 0   # partial bytecode is fine; Sonar still analyses everything

      # ── Gradle projects ───────────────────────────────────────────────────
      # 4 projects use Gradle (MongoDB CRUD, GitApi, SpringSecLogInOut, SpringGradle).
      # compile only — no tests, no daemon in CI.
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Compile Gradle projects
        shell: bash
        run: |
          set -uo pipefail
          FAILED=""

          while IFS= read -r build; do
            dir=$(dirname "$build")
            echo "::group::Compiling (Gradle) $dir"

            build_output=$(cd "$dir" && \
              gradle compileJava \
                --no-daemon \
                --quiet \
                --warning-mode none \
                -x test 2>&1) && rc=0 || rc=$?

            if [ $rc -eq 0 ]; then
              echo "  ✅ OK"
            else
              echo "$build_output"
              echo "  ⚠️  SKIPPED (Gradle compile failed — source-only Sonar analysis)"
              FAILED="$FAILED\n  - $dir"
            fi
            echo "::endgroup::"
          done < <(find . -name build.gradle -not -path '*/target/*' | sort)

          [ -n "$FAILED" ] && { printf '\nGradle skipped (source-only):\n%b\n' "$FAILED"; }
          exit 0

      # ── SonarCloud ────────────────────────────────────────────────────────
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=research-projects-all
            -Dsonar.projectKey=research-projects-all_SpringBoot-Projects-FullStack
            -Dsonar.sources=.
            -Dsonar.java.binaries=**/target/classes,**/build/classes
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/src/test/**/*.java
            -Dsonar.exclusions=**/target/**,**/build/**,**/.mvn/**,**/mvnw,**/mvnw.cmd,**/node_modules/**,**/frontend/**
            -Dsonar.coverage.exclusions=**/test/**,**/*Test*.java,**/*Tests*.java,**/*Application.java
